name: mobile
description: "Business Manager — workspace platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.2.3
  fl_chart: ^1.2.0
  local_auth: ^2.3.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  google_fonts: ^8.2.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/